name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Check and build plugin
        run: sh build.sh

      - name: Upload plugin dist
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funsecret
          path: |
            utools/dist
            utools/plugin.json
            utools/preload.js
            utools/cli.js
            utools/logo.png
            utools/search.png
          if-no-files-found: error
          retention-days: 7
